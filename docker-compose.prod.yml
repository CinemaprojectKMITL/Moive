services:
  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [cinema]

  mongo-init:
    image: mongo:7.0
    restart: "no"
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./docker/mongo-init.sh:/scripts/mongo-init.sh:ro
    entrypoint: ["sh", "/scripts/mongo-init.sh"]
    networks: [cinema]

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      target: production
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      API_PORT: 3000
      MONGO_URI: mongodb://mongodb:27017/cinema?replicaSet=rs0
      CORS_ORIGIN: http://localhost:${WEB_PORT:-8080}
    volumes:
      - media-data:/app/migdata
      - qr-data:/app/qrdata
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [cinema]

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      target: production
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    networks: [cinema]

volumes:
  mongo-data:
  media-data:
  qr-data:

networks:
  cinema:
    driver: bridge
